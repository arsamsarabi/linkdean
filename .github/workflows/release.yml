name: Release

# Push a tag such as v0.0.1 to run CI, publish ghcr.io/<owner>/linkdean:<version>
# (plus <major>.<minor> and latest), and create a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push image
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo and package.json versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          web_version=$(jq -r .version apps/web/package.json)
          echo "tag=$tag cargo=$cargo_version web=$web_version"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$web_version" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml ($cargo_version) or apps/web/package.json ($web_version)"
            exit 1
          fi

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/linkdean" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Linkdean
            org.opencontainers.image.description=Self-hosted bookmarks server

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub release
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/linkdean:${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease \
            --notes "Image: \`$image\`" \
            deploy/docker/docker-compose.yml deploy/docker/chrome-seccomp.json
