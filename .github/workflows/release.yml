name: Release

# Push a tag such as v0.2.0 on a commit in main. The workflow:
#   1. checks the tag is on main, and whether the browser extension changed since the previous
#      release tag,
#   2. runs CI,
#   3. builds and pushes the app image for the tag,
#   4. submits the browser extension to the Chrome Web Store and AMO when its build inputs
#      changed and apps/extension/package.json has a higher version than at the previous tag,
#   5. creates the GitHub release.
#
# Every release builds the image, so every tag must match the version in Cargo.toml and
# apps/web/package.json. Run it by hand (Actions → Release → Run workflow, on a tag) to build
# the image again.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    name: Tag and extension checks
    runs-on: ubuntu-24.04
    outputs:
      extension: ${{ steps.diff.outputs.extension }}
      extension_version: ${{ steps.diff.outputs.extension_version }}
      previous: ${{ steps.diff.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag is on main
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Run the Release workflow on a tag, not $GITHUB_REF_NAME"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - id: diff
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$GITHUB_SHA^" 2>/dev/null || true)
          out previous "$previous"
          version=$(jq -r .version apps/extension/package.json)
          out extension_version "$version"

          # The extension goes to the stores only when its build inputs changed since the
          # previous tag (not tests, the store kit or the README) and its version went up,
          # since both stores refuse a version they already have. A build change without a
          # version bump is skipped with a warning.
          extension=false
          if [ -n "$previous" ]; then
            ext_files=$(git diff --name-only "$previous" "$GITHUB_SHA" -- apps/extension |
              grep -Ev '^apps/extension/(store/|README\.md$)|\.test\.tsx?$' || true)
            before=$(git show "$previous:apps/extension/package.json" 2>/dev/null | jq -r '.version // empty' || true)
            if [ -z "$ext_files" ]; then
              echo "Extension build inputs unchanged since $previous"
            elif [ -n "$before" ] && [ "$(printf '%s\n%s\n' "$before" "$version" | sort -V | tail -n1)" = "$before" ]; then
              echo "::warning::The extension changed since $previous but its version is still $version (was $before). Bump apps/extension/package.json to submit it to the stores."
            else
              extension=true
            fi
          fi
          out extension "$extension"

  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push app image
    needs: [changes, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches Cargo and package.json versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          web_version=$(jq -r .version apps/web/package.json)
          echo "tag=$tag cargo=$cargo_version web=$web_version"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$web_version" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml ($cargo_version) or apps/web/package.json ($web_version)"
            exit 1
          fi

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/linkdean" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Linkdean
            org.opencontainers.image.description=Self-hosted bookmarks server

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  extension:
    name: Submit the extension to the stores
    needs: [changes, ci]
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    # Secrets live in this environment; add required reviewers there to approve each submission.
    environment: extension-stores
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/extension/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm zip
      - run: pnpm zip:firefox
      - name: Submit for review
        env:
          VERSION: ${{ needs.changes.outputs.extension_version }}
          # Chrome Web Store API v2, signed in as a service account added to the publisher.
          CHROME_API_VERSION: v2
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: firefox@linkdean.app
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          pnpm exec wxt submit \
            --chrome-zip ".output/linkdean-extension-$VERSION-chrome.zip" \
            --firefox-zip ".output/linkdean-extension-$VERSION-firefox.zip" \
            --firefox-sources-zip ".output/linkdean-extension-$VERSION-sources.zip"

  github-release:
    name: Create GitHub release
    needs: [changes, ci, image, extension]
    # Publish once CI passed, the image pushed and the extension (if changed) went to the stores.
    if: >
      always() &&
      github.event_name == 'push' &&
      needs.ci.result == 'success' &&
      needs.image.result == 'success' &&
      (needs.extension.result == 'success' || needs.extension.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          EXTENSION: ${{ needs.changes.outputs.extension }}
          EXTENSION_VERSION: ${{ needs.changes.outputs.extension_version }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease="--prerelease" ;; esac
          notes="Image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/linkdean:${GITHUB_REF_NAME#v}\`."
          if [ "$EXTENSION" = true ]; then
            notes="$notes Browser extension $EXTENSION_VERSION submitted to the Chrome Web Store and AMO for review."
          fi
          notes="$notes Docs: [docs.linkdean.app](https://docs.linkdean.app)."
          # Copy this version's "### Breaking" section from the changelog. The app's sidebar
          # badge reads that heading in the release notes to warn admins before they update.
          # Without a "## [x.y.z]" section for this version, [Unreleased] holds its changes.
          section="## [${GITHUB_REF_NAME#v}]"
          grep -qF "$section" docs/CHANGELOG.md || section="## [Unreleased]"
          breaking=$(awk -v v="$section" '
            index($0, v) == 1 { inv = 1; next }
            inv && /^## \[/ { exit }
            inv && /^### / { inb = ($0 ~ /^### Breaking/) }
            inv && inb { print }' docs/CHANGELOG.md)
          if [ -n "$breaking" ]; then
            notes="$notes"$'\n\n'"$breaking"
          fi
          # A moved tag leaves its old release behind (as a draft once the tag is deleted).
          # Remove it so this run's release replaces it.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" |
            while read -r id; do
              echo "Deleting existing release $id for $GITHUB_REF_NAME"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease --notes "$notes"
