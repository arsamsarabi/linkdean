name: Release

# Push a tag such as v0.2.0 on a commit in main. The workflow:
#   1. works out which apps changed since the previous release tag (app, docs, site),
#   2. runs CI,
#   3. builds and pushes the app image only when the app changed,
#   4. rolls the public-beta guest forward to the tag, refreshing only the changed apps,
#   5. checks on the guest and over the public URLs that each changed app is live,
#   6. submits the browser extension to the Chrome Web Store and AMO when its build inputs
#      changed and apps/extension/package.json has a higher version than at the previous tag,
#   7. creates the GitHub release.
#
# Deploy needs the repository variable NOVA_DEPLOY_ENABLED=true and a self-hosted runner
# labelled linkdean-nova on the Nova host (it runs `lxc exec linkdean-public` locally).
# Without the variable the release still builds and publishes, and deploy/verify are skipped.
#
# Run it by hand (Actions → Release → Run workflow, on a tag) to redeploy a release; tick
# "Deploy every app" to refresh all three regardless of what changed.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      all:
        description: Deploy every app, not only the ones changed since the previous tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    name: Changed apps since the previous release
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.diff.outputs.app }}
      docs: ${{ steps.diff.outputs.docs }}
      site: ${{ steps.diff.outputs.site }}
      extension: ${{ steps.diff.outputs.extension }}
      extension_version: ${{ steps.diff.outputs.extension_version }}
      previous: ${{ steps.diff.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag is on main
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Run the Release workflow on a tag, not $GITHUB_REF_NAME"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - id: diff
        env:
          ALL: ${{ inputs.all }}
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$GITHUB_SHA^" 2>/dev/null || true)
          out previous "$previous"
          version=$(jq -r .version apps/extension/package.json)
          out extension_version "$version"
          if [ -z "$previous" ] || [ "$ALL" = true ]; then
            out app true; out docs true; out site true
          else
            files=$(git diff --name-only "$previous" "$GITHUB_SHA")
            has() { if grep -Eq "$1" <<<"$files"; then echo true; else echo false; fi; }
            # Keep these patterns in step with deploy/public-beta/scripts/pull-update.sh.
            out app  "$(has '^(crates/|apps/web/|migrations/|deploy/docker/|Cargo\.(toml|lock)$)')"
            out docs "$(has '^(apps/docs/|deploy/public-beta/static/docs/|docs/(self-hosting/[^/]+|product/(features|architecture)|guides/fast-capture)\.md$)')"
            out site "$(has '^(apps/site/|deploy/public-beta/static/site/)')"
          fi

          # The extension goes to the stores only when its build inputs changed since the
          # previous tag (not tests, the store kit or the README) and its version went up,
          # since both stores refuse a version they already have. "Deploy every app" does
          # not resubmit it. A build change without a version bump is skipped with a warning.
          extension=false
          if [ -n "$previous" ]; then
            ext_files=$(git diff --name-only "$previous" "$GITHUB_SHA" -- apps/extension |
              grep -Ev '^apps/extension/(store/|README\.md$)|\.test\.tsx?$' || true)
            before=$(git show "$previous:apps/extension/package.json" 2>/dev/null | jq -r '.version // empty' || true)
            if [ -z "$ext_files" ]; then
              echo "Extension build inputs unchanged since $previous"
            elif [ -n "$before" ] && [ "$(printf '%s\n%s\n' "$before" "$version" | sort -V | tail -n1)" = "$before" ]; then
              echo "::warning::The extension changed since $previous but its version is still $version (was $before). Bump apps/extension/package.json to submit it to the stores."
            else
              extension=true
            fi
          fi
          out extension "$extension"

  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push app image
    needs: [changes, ci]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches Cargo and package.json versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          web_version=$(jq -r .version apps/web/package.json)
          echo "tag=$tag cargo=$cargo_version web=$web_version"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$web_version" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml ($cargo_version) or apps/web/package.json ($web_version)"
            exit 1
          fi

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/linkdean" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Linkdean
            org.opencontainers.image.description=Self-hosted bookmarks server

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the public-beta guest
    needs: [changes, ci, image]
    # The image job is skipped when the app did not change; deploy still runs for docs or site.
    if: >
      always() &&
      vars.NOVA_DEPLOY_ENABLED == 'true' &&
      needs.ci.result == 'success' &&
      (needs.image.result == 'success' || needs.image.result == 'skipped') &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.site == 'true')
    # Self-hosted on Nova (label linkdean-nova). Do not use this label on pull_request jobs.
    runs-on: [self-hosted, linkdean-nova]
    steps:
      - name: Roll forward and verify on the guest
        env:
          LXC: linkdean-public
          APP: ${{ needs.changes.outputs.app }}
          DOCS: ${{ needs.changes.outputs.docs }}
          SITE: ${{ needs.changes.outputs.site }}
        run: |
          set -euo pipefail
          if ! command -v lxc >/dev/null; then
            echo "::error::lxc not found on the self-hosted runner"
            exit 1
          fi
          # The repo lives at /opt/linkdean inside the public-beta LXD guest.
          lxc exec "$LXC" -- bash -s <<EOF
          set -euo pipefail
          cd /opt/linkdean
          git fetch --tags --force origin
          git checkout --detach "$GITHUB_REF_NAME"
          EOF

          # Infisical → guest Compose .env (restic keys filtered). Run on the Nova host
          # so the Infisical CLI / machine identity stay off the public VM; script comes
          # from the tag just checked out on the guest.
          RENDER=/opt/linkdean/deploy/public-beta/scripts/render-env-from-infisical.sh
          if lxc exec "$LXC" -- test -f "$RENDER"; then
            lxc file pull "$LXC$RENDER" /tmp/render-env-from-infisical.sh
            chmod +x /tmp/render-env-from-infisical.sh
            LXC="$LXC" bash /tmp/render-env-from-infisical.sh
            rm -f /tmp/render-env-from-infisical.sh
          else
            echo "::warning::render-env-from-infisical.sh missing on guest; skipping Infisical render"
          fi

          lxc exec "$LXC" -- bash -s <<EOF
          set -euo pipefail
          cd /opt/linkdean
          RELEASE_TAG="$GITHUB_REF_NAME" UPDATE_APP=$APP UPDATE_DOCS=$DOCS UPDATE_SITE=$SITE \\
            bash deploy/public-beta/scripts/pull-update.sh
          RELEASE_TAG="$GITHUB_REF_NAME" CHECK_APP=$APP CHECK_DOCS=$DOCS CHECK_SITE=$SITE \\
            bash deploy/public-beta/scripts/verify.sh
          EOF

  verify-public:
    name: Verify the public URLs
    needs: [changes, deploy]
    runs-on: ubuntu-24.04
    steps:
      - name: Changed apps answer through Cloudflare
        env:
          APP: ${{ needs.changes.outputs.app }}
          DOCS: ${{ needs.changes.outputs.docs }}
          SITE: ${{ needs.changes.outputs.site }}
        run: |
          get() { curl -fsS --retry 10 --retry-delay 6 --retry-all-errors -A linkdean-release-check "$1"; }
          if [ "$APP" = true ]; then
            want="${GITHUB_REF_NAME#v}"
            got=$(get "https://app.linkdean.app/api/health?release=$GITHUB_SHA" | jq -r .version)
            echo "app.linkdean.app reports $got"
            [ "$got" = "$want" ] || { echo "::error::app.linkdean.app reports $got, expected $want"; exit 1; }
          fi
          if [ "$DOCS" = true ]; then get "https://docs.linkdean.app/?release=$GITHUB_SHA" >/dev/null && echo "docs.linkdean.app ok"; fi
          if [ "$SITE" = true ]; then get "https://linkdean.app/?release=$GITHUB_SHA" >/dev/null && echo "linkdean.app ok"; fi

  extension:
    name: Submit the extension to the stores
    needs: [changes, ci]
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    # Secrets live in this environment; add required reviewers there to approve each submission.
    environment: extension-stores
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/extension/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm zip
      - run: pnpm zip:firefox
      - name: Submit for review
        env:
          VERSION: ${{ needs.changes.outputs.extension_version }}
          # Chrome Web Store API v2, signed in as a service account added to the publisher.
          CHROME_API_VERSION: v2
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: firefox@linkdean.app
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          pnpm exec wxt submit \
            --chrome-zip ".output/linkdean-extension-$VERSION-chrome.zip" \
            --firefox-zip ".output/linkdean-extension-$VERSION-firefox.zip" \
            --firefox-sources-zip ".output/linkdean-extension-$VERSION-sources.zip"

  github-release:
    name: Create GitHub release
    needs: [changes, ci, image, deploy, extension]
    # Publish once CI passed, the image (if any) pushed, the deploy (if enabled) succeeded and
    # the extension (if changed) went to the stores.
    if: >
      always() &&
      github.event_name == 'push' &&
      needs.ci.result == 'success' &&
      (needs.image.result == 'success' || needs.image.result == 'skipped') &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      (needs.extension.result == 'success' || needs.extension.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ needs.changes.outputs.app }}
          DOCS: ${{ needs.changes.outputs.docs }}
          SITE: ${{ needs.changes.outputs.site }}
          EXTENSION: ${{ needs.changes.outputs.extension }}
          EXTENSION_VERSION: ${{ needs.changes.outputs.extension_version }}
          PREVIOUS: ${{ needs.changes.outputs.previous }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease="--prerelease" ;; esac
          apps=""
          [ "$APP" = true ] && apps="$apps app"
          [ "$DOCS" = true ] && apps="$apps docs"
          [ "$SITE" = true ] && apps="$apps site"
          notes="Changed since ${PREVIOUS:-the first commit}:${apps:- nothing deployable}."
          if [ "$EXTENSION" = true ]; then
            notes="$notes Browser extension $EXTENSION_VERSION submitted to the Chrome Web Store and AMO for review."
          fi
          if [ "$APP" = true ]; then
            notes="$notes Image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/linkdean:${GITHUB_REF_NAME#v}\`."
          fi
          notes="$notes Docs: [docs.linkdean.app](https://docs.linkdean.app)."
          # A moved tag leaves its old release behind (as a draft once the tag is deleted).
          # Remove it so this run's release replaces it.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" |
            while read -r id; do
              echo "Deleting existing release $id for $GITHUB_REF_NAME"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease --notes "$notes"
