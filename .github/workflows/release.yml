name: Release

# Push a tag such as v0.2.0 on a commit in main. The workflow:
#   1. works out which apps changed since the previous release tag (app, docs, site),
#   2. runs CI,
#   3. builds and pushes the app image only when the app changed,
#   4. rolls the public-beta guest forward to the tag, refreshing only the changed apps,
#   5. checks on the guest and over the public URLs that each changed app is live,
#   6. creates the GitHub release.
#
# Deploy needs the repository variable NOVA_DEPLOY_ENABLED=true and the secrets
# NOVA_DEPLOY_HOST, NOVA_DEPLOY_USER, NOVA_DEPLOY_SSH_KEY (and NOVA_DEPLOY_LXC when SSH lands
# on the Nova host rather than the guest). Without the variable the release still builds
# and publishes, and the deploy and verify jobs are skipped.
#
# Run it by hand (Actions → Release → Run workflow, on a tag) to redeploy a release; tick
# "Deploy every app" to refresh all three regardless of what changed.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      all:
        description: Deploy every app, not only the ones changed since the previous tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    name: Changed apps since the previous release
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.diff.outputs.app }}
      docs: ${{ steps.diff.outputs.docs }}
      site: ${{ steps.diff.outputs.site }}
      previous: ${{ steps.diff.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag is on main
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Run the Release workflow on a tag, not $GITHUB_REF_NAME"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - id: diff
        env:
          ALL: ${{ inputs.all }}
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$GITHUB_SHA^" 2>/dev/null || true)
          out previous "$previous"
          if [ -z "$previous" ] || [ "$ALL" = true ]; then
            out app true; out docs true; out site true
            exit 0
          fi
          files=$(git diff --name-only "$previous" "$GITHUB_SHA")
          has() { if grep -Eq "$1" <<<"$files"; then echo true; else echo false; fi; }
          # Keep these patterns in step with deploy/public-beta/scripts/pull-update.sh.
          out app  "$(has '^(crates/|apps/web/|migrations/|deploy/docker/|Cargo\.(toml|lock)$)')"
          out docs "$(has '^(apps/docs/|deploy/public-beta/static/docs/|docs/(INSTALL|SELF_HOSTED|FEATURES|ARCHITECTURE)\.md$)')"
          out site "$(has '^(apps/site/|deploy/public-beta/static/site/)')"

  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push app image
    needs: [changes, ci]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo and package.json versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          web_version=$(jq -r .version apps/web/package.json)
          echo "tag=$tag cargo=$cargo_version web=$web_version"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$web_version" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml ($cargo_version) or apps/web/package.json ($web_version)"
            exit 1
          fi

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/linkdean" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Linkdean
            org.opencontainers.image.description=Self-hosted bookmarks server

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the public-beta guest
    needs: [changes, ci, image]
    # The image job is skipped when the app did not change; deploy still runs for docs or site.
    if: >
      always() &&
      vars.NOVA_DEPLOY_ENABLED == 'true' &&
      needs.ci.result == 'success' &&
      (needs.image.result == 'success' || needs.image.result == 'skipped') &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.site == 'true')
    runs-on: ubuntu-24.04
    environment: public-beta
    steps:
      - name: Install SSH key
        env:
          HOST: ${{ secrets.NOVA_DEPLOY_HOST }}
          USER: ${{ secrets.NOVA_DEPLOY_USER }}
          KEY: ${{ secrets.NOVA_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "::error::NOVA_DEPLOY_ENABLED is true but NOVA_DEPLOY_HOST, NOVA_DEPLOY_USER or NOVA_DEPLOY_SSH_KEY is missing"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Roll forward and verify on the guest
        env:
          HOST: ${{ secrets.NOVA_DEPLOY_HOST }}
          USER: ${{ secrets.NOVA_DEPLOY_USER }}
          # Optional. When set, SSH lands on the Nova host and runs inside this LXD instance.
          LXC: ${{ secrets.NOVA_DEPLOY_LXC }}
          APP: ${{ needs.changes.outputs.app }}
          DOCS: ${{ needs.changes.outputs.docs }}
          SITE: ${{ needs.changes.outputs.site }}
        run: |
          remote() {
            local cmd="bash -s"
            if [ -n "${LXC:-}" ]; then cmd="lxc exec $LXC -- bash -s"; fi
            ssh -o BatchMode=yes "$USER@$HOST" "$cmd"
          }
          # The repo lives at /opt/linkdean on the guest.
          remote <<EOF
          set -euo pipefail
          cd /opt/linkdean
          git fetch --tags --force origin
          git checkout --detach "$GITHUB_REF_NAME"
          RELEASE_TAG="$GITHUB_REF_NAME" UPDATE_APP=$APP UPDATE_DOCS=$DOCS UPDATE_SITE=$SITE \
            bash deploy/public-beta/scripts/pull-update.sh
          RELEASE_TAG="$GITHUB_REF_NAME" CHECK_APP=$APP CHECK_DOCS=$DOCS CHECK_SITE=$SITE \
            bash deploy/public-beta/scripts/verify.sh
          EOF

  verify-public:
    name: Verify the public URLs
    needs: [changes, deploy]
    runs-on: ubuntu-24.04
    steps:
      - name: Changed apps answer through Cloudflare
        env:
          APP: ${{ needs.changes.outputs.app }}
          DOCS: ${{ needs.changes.outputs.docs }}
          SITE: ${{ needs.changes.outputs.site }}
        run: |
          get() { curl -fsS --retry 10 --retry-delay 6 --retry-all-errors -A linkdean-release-check "$1"; }
          if [ "$APP" = true ]; then
            want="${GITHUB_REF_NAME#v}"
            got=$(get "https://app.linkdean.app/api/health?release=$GITHUB_SHA" | jq -r .version)
            echo "app.linkdean.app reports $got"
            [ "$got" = "$want" ] || { echo "::error::app.linkdean.app reports $got, expected $want"; exit 1; }
          fi
          if [ "$DOCS" = true ]; then get "https://docs.linkdean.app/?release=$GITHUB_SHA" >/dev/null && echo "docs.linkdean.app ok"; fi
          if [ "$SITE" = true ]; then get "https://linkdean.app/?release=$GITHUB_SHA" >/dev/null && echo "linkdean.app ok"; fi

  github-release:
    name: Create GitHub release
    needs: [changes, ci, image, deploy]
    # Publish once CI passed, the image (if any) pushed and the deploy (if enabled) succeeded.
    if: >
      always() &&
      github.event_name == 'push' &&
      needs.ci.result == 'success' &&
      (needs.image.result == 'success' || needs.image.result == 'skipped') &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ needs.changes.outputs.app }}
          DOCS: ${{ needs.changes.outputs.docs }}
          SITE: ${{ needs.changes.outputs.site }}
          PREVIOUS: ${{ needs.changes.outputs.previous }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease="--prerelease" ;; esac
          apps=""
          [ "$APP" = true ] && apps="$apps app"
          [ "$DOCS" = true ] && apps="$apps docs"
          [ "$SITE" = true ] && apps="$apps site"
          notes="Changed since ${PREVIOUS:-the first commit}:${apps:- nothing deployable}."
          if [ "$APP" = true ]; then
            notes="$notes Image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/linkdean:${GITHUB_REF_NAME#v}\`."
          fi
          notes="$notes Docs: [docs.linkdean.app](https://docs.linkdean.app)."
          # A moved tag leaves its old release behind (as a draft once the tag is deleted).
          # Remove it so this run's release replaces it.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" |
            while read -r id; do
              echo "Deleting existing release $id for $GITHUB_REF_NAME"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease --notes "$notes"
