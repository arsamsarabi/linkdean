name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Docs (install guide in sync)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 deploy/scripts/sync_install_seccomp.py --check

  rust-audit:
    name: Rust (cargo audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  rust:
    name: Rust (fmt, nextest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkdean
          POSTGRES_PASSWORD: linkdean
          POSTGRES_DB: linkdean_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linkdean -d linkdean_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # DB tests skip silently without this, so CI always sets it.
      DATABASE_URL: postgres://linkdean:linkdean@localhost:5432/linkdean_test
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake libwebp-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all -- --check
      # Runs tests in parallel across all test binaries; see .config/nextest.toml for the
      # files that share global state and take turns.
      - run: cargo nextest run --workspace --locked --profile ci
      # nextest does not run doctests.
      - run: cargo test --workspace --locked --doc

  web:
    name: Web (format, lint, types, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Runtime deps only; build-tool advisories (vite-plugin-pwa → workbox) are tracked via Dependabot.
      - run: pnpm audit --prod
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docs-site:
    name: Docs site (Docusaurus build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Webpack content hashes differ between macOS and Linux, so the committed
      # deploy/public-beta/static/docs tree is not compared byte for byte; the build must pass.
      - run: pnpm build

  site:
    name: Site (Astro build, committed output in sync)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm build
      # The build lands in deploy/public-beta/static/site, which Caddy serves. Fail if the
      # committed copy is stale, so the deployed site always matches apps/site.
      - name: Committed build is current
        working-directory: .
        run: |
          git status --porcelain -- deploy/public-beta/static/site
          test -z "$(git status --porcelain -- deploy/public-beta/static/site)"
