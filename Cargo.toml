[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/core",
    "crates/db",
    "crates/mail",
    "crates/search",
    "crates/worker",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Linkdean Contributors"]
repository = "https://github.com/arsamsarabi/linkdean"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
meilisearch-sdk = "0.28"
oauth2 = "5"
openidconnect = "4"
password-hash = "0.5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
aes-gcm = "0.11"
crypto_box = { version = "0.9.1", features = ["seal"] }
csv = "1"
chromiumoxide = { version = "0.8", default-features = false, features = ["tokio-runtime"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
webp = "0.3"
linkdean-core = { path = "crates/core" }
linkdean-db = { path = "crates/db" }
linkdean-search = { path = "crates/search" }
linkdean-worker = { path = "crates/worker" }
linkdean-mail = { path = "crates/mail" }
html2text = "0.17.4"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1", "tokio1-rustls-tls"] }
minijinja = "2.24.0"
mrml = "6.0.1"

# Tests and the dev stack build unoptimized, which makes each Argon2id hash (64 MiB, 3 passes)
# take seconds. Optimize just the hashing crates; release builds are unaffected.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
