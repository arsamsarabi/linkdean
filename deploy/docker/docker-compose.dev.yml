# Development stack with live reload. Open http://localhost:5173.
# Shares its project name and data volumes with docker-compose.yml, so run one at a time.
# Ports bind to localhost only: these services use published dev credentials.
# Known gap: because volumes are shared, a production stack started on the same Docker
# host reuses this dev data, credentials included. Give production its own project name
# (`-p`) on any host that also runs this file.
name: linkdean

services:
  db:
    image: postgres:16-alpine
    networks: [data]
    environment:
      POSTGRES_USER: linkdean
      POSTGRES_PASSWORD: linkdean
      POSTGRES_DB: linkdean
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkdean -d linkdean"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    networks: [data]
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_change_me}
      MEILI_ENV: development
    volumes:
      - meili:/meili_data
    ports:
      - "127.0.0.1:7700:7700"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  chrome:
    # Pinned. Chrome renders untrusted pages, so bump this with each stable release.
    image: chromedp/headless-shell:156.0.8078.36
    restart: unless-stopped
    # Chrome's own sandbox is on: it runs as nobody with no capabilities, and the seccomp
    # profile is Docker's default plus the namespace calls the sandbox needs. The image's
    # entrypoint would add --no-sandbox, so this runs Chrome directly. Newer Chrome only binds
    # DevTools to localhost; socat exposes it on 9222.
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    environment:
      HOME: /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./chrome-seccomp.json
    shm_size: 256mb
    mem_limit: 1g
    pids_limit: 512
    ports:
      - "127.0.0.1:9222:9222"
    # Same split as production: no route to the database or search.
    networks: [browser]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        socat TCP4-LISTEN:9222,fork TCP4:127.0.0.1:9223 &
        exec /headless-shell/headless-shell
        --use-gl=angle --use-angle=swiftshader
        --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223
        --hide-scrollbars --font-render-hinting=none

  # Catches every email the dev API sends; nothing leaves the machine.
  # Web UI: http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit:v1.31.0
    networks: [mail]
    ports:
      - "127.0.0.1:8025:8025"

  # Rebuilds and restarts on changes under crates/ and migrations/.
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    networks: [data, browser, web, mail]
    environment:
      DATABASE_URL: postgres://linkdean:linkdean@db:5432/linkdean
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_change_me}
      APP_URL: ${APP_URL:-http://localhost:5173}
      SESSION_SECRET: ${SESSION_SECRET:-dev_session_secret_change_me}
      # Development only. The API refuses the well-known values above without this.
      ALLOW_DEFAULT_SECRETS: "true"
      BIND: 0.0.0.0:8080
      AVATAR_DIR: /app/data/avatars
      PREVIEW_DIR: /app/data/previews
      BROWSER_WS_URL: http://chrome:9222
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      MAIL_FROM: Linkdean Dev <linkdean@dev.localhost>
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../..:/src
      - api_target:/src/target
      - cargo_registry:/usr/local/cargo/registry
      - avatars:/app/data/avatars
      - previews:/app/data/previews
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      chrome:
        condition: service_started
      mailpit:
        condition: service_started

  # Vite with hot module replacement. node_modules stays in a volume because
  # this Alpine image needs different native binaries from the host.
  web:
    image: node:22-alpine
    networks: [web]
    working_dir: /web
    environment:
      API_PROXY_TARGET: http://api:8080
      CI: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../../apps/web:/web
      - web_node_modules:/web/node_modules

networks:
  data:
  browser:
  web:
  mail:

volumes:
  pgdata:
  meili:
  avatars:
  previews:
  api_target:
  cargo_registry:
  web_node_modules:
