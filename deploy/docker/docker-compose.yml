# Production stack. For local development use docker-compose.dev.yml.
# Set POSTGRES_PASSWORD, MEILI_MASTER_KEY and SESSION_SECRET. See .env.example.
name: linkdean

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkdean
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: linkdean
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkdean -d linkdean"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      MEILI_ENV: production
    networks: [data]
    volumes:
      - meili:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  chrome:
    image: zenika/alpine-chrome:124
    restart: unless-stopped
    shm_size: 256mb
    # Chrome renders untrusted pages, so it gets no route to the database or search.
    networks: [browser]
    command:
      # Known issue: Chrome 124 runs without its sandbox, so a renderer exploit gets a shell in this
      # container. Production keeps it off the database and search networks. Fix: a maintained
      # Chrome image, the sandbox where possible, and memory and pid limits.
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
      - --font-render-hinting=none

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    networks: [data, browser]
    environment:
      DATABASE_URL: postgres://linkdean:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/linkdean
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      BIND: 0.0.0.0:8080
      STATIC_DIR: /app/static
      AVATAR_DIR: /app/data/avatars
      PREVIEW_DIR: /app/data/previews
      BROWSER_WS_URL: http://chrome:9222
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      - avatars:/app/data/avatars
      # screenshots ({id}.jpg) + favicon/OG ({id}.favicon[.ct], {id}.og[.ct])
      - previews:/app/data/previews
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      chrome:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

networks:
  data:
  browser:

volumes:
  pgdata:
  meili:
  avatars:
  previews:
