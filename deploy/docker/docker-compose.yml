name: linkdean

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linkdean
      POSTGRES_PASSWORD: linkdean
      POSTGRES_DB: linkdean
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkdean -d linkdean"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_change_me}
      MEILI_ENV: development
    volumes:
      - meili:/meili_data
    ports:
      - "7700:7700"

  chrome:
    image: zenika/alpine-chrome:124
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - "9222:9222"
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
      - --font-render-hinting=none

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      DATABASE_URL: postgres://linkdean:linkdean@db:5432/linkdean
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_change_me}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      BIND: 0.0.0.0:8080
      STATIC_DIR: /app/static
      AVATAR_DIR: /app/data/avatars
      PREVIEW_DIR: /app/data/previews
      BROWSER_WS_URL: http://chrome:9222
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - avatars:/app/data/avatars
      - previews:/app/data/previews
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
      chrome:
        condition: service_started

volumes:
  pgdata:
  meili:
  avatars:
  previews:
