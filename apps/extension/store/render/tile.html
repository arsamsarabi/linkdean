<!doctype html>
<!-- Store small promo tile, 440x280 (store/render/render.sh). -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
      }
      body {
        background: linear-gradient(140deg, #8458b3 0%, #6b3f9c 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 40px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        color: #fff;
      }
      img {
        height: 84px;
        align-self: flex-start;
        margin: 0 0 14px -12px;
      }
      h1 {
        font-size: 27px;
        line-height: 1.2;
        letter-spacing: -0.01em;
        font-weight: 700;
      }
      p {
        margin-top: 10px;
        font-size: 15px;
        color: #e5eaf5;
      }
    </style>
  </head>
  <body>
    <img src="linkdean-horizontal-white.svg" alt="Linkdean" />
    <h1>Save any page to your library</h1>
    <p>For Chrome, Edge and Firefox</p>
  </body>
</html>
